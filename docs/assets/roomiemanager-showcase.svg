<svg width="1640" height="520" viewBox="0 0 1640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoomieManager product showcase</title>
  <desc id="desc">A warm green illustration showing dashboard, finance, and chores views.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1640" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F4EA"/>
      <stop offset="0.52" stop-color="#EAF3E7"/>
      <stop offset="1" stop-color="#F7F0E4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#2F4F36" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#233327}
      .small{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6F7C70}
      .tiny{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#7D887E}
      .serif{font:600 52px Georgia,"Times New Roman",serif;fill:#233327}
    </style>
  </defs>

  <rect width="1640" height="520" rx="42" fill="url(#wash)"/>
  <circle cx="142" cy="103" r="86" fill="#DDEBD7" opacity="0.65"/>
  <circle cx="1480" cy="420" r="118" fill="#EBDCC8" opacity="0.55"/>
  <circle cx="1100" cy="90" r="58" fill="#CFE3C7" opacity="0.55"/>

  <g transform="translate(100 62)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="#DDEED7"/>
    <path d="M19 32.5 30 23l11 9.5v12a2 2 0 0 1-2 2h-6.5v-9h-5v9H21a2 2 0 0 1-2-2v-12Z" fill="#3F7D4E"/>
    <text x="78" y="38" class="serif">RoomieManager</text>
    <text x="80" y="68" class="small">shared-home management, softly organized</text>
  </g>

  <!-- Left dashboard window -->
  <g transform="translate(150 184) rotate(-4 245 145)" filter="url(#shadow)">
    <rect width="490" height="286" rx="24" fill="#FFFFFF"/>
    <rect x="0" y="0" width="490" height="52" rx="24" fill="#F7FAF4"/>
    <circle cx="32" cy="26" r="7" fill="#E7A8A1"/>
    <circle cx="54" cy="26" r="7" fill="#F1C86A"/>
    <circle cx="76" cy="26" r="7" fill="#83B06D"/>
    <text x="106" y="32" class="small">Cedar House Dashboard</text>
    <rect x="28" y="78" width="204" height="82" rx="18" fill="#F0F8EC"/>
    <rect x="258" y="78" width="204" height="82" rx="18" fill="#FFF7EA"/>
    <rect x="28" y="184" width="434" height="68" rx="18" fill="#F8FAF6"/>
    <text x="48" y="112" class="title">3 chores</text>
    <text x="48" y="137" class="tiny">due this week</text>
    <text x="278" y="112" class="title">$42</text>
    <text x="278" y="137" class="tiny">ready to settle</text>
    <circle cx="58" cy="218" r="16" fill="#DDEED7"/>
    <rect x="86" y="205" width="210" height="10" rx="5" fill="#D7E5D0"/>
    <rect x="86" y="225" width="134" height="10" rx="5" fill="#E7EEE2"/>
    <rect x="350" y="204" width="82" height="32" rx="16" fill="#3F7D4E"/>
  </g>

  <!-- Center finance window -->
  <g transform="translate(562 142)" filter="url(#shadow)">
    <rect width="560" height="330" rx="28" fill="#FFFFFF"/>
    <rect width="560" height="58" rx="28" fill="#F7FAF4"/>
    <circle cx="34" cy="29" r="7" fill="#E7A8A1"/>
    <circle cx="56" cy="29" r="7" fill="#F1C86A"/>
    <circle cx="78" cy="29" r="7" fill="#83B06D"/>
    <text x="112" y="36" class="small">Finance</text>
    <rect x="32" y="86" width="496" height="78" rx="20" fill="#F0F8EC"/>
    <text x="58" y="121" class="title">You are owed $18.40</text>
    <rect x="388" y="104" width="104" height="34" rx="17" fill="#3F7D4E"/>
    <text x="414" y="126" style="font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Settle up</text>
    <g transform="translate(32 188)">
      <rect width="496" height="44" rx="14" fill="#FBFCFA"/>
      <circle cx="26" cy="22" r="12" fill="#DDEED7"/>
      <rect x="52" y="14" width="156" height="9" rx="4.5" fill="#C9DAC3"/>
      <rect x="52" y="29" width="92" height="7" rx="3.5" fill="#E4ECE0"/>
      <rect x="396" y="14" width="66" height="16" rx="8" fill="#F5E8D3"/>
    </g>
    <g transform="translate(32 246)">
      <rect width="496" height="44" rx="14" fill="#FBFCFA"/>
      <circle cx="26" cy="22" r="12" fill="#F1D8CB"/>
      <rect x="52" y="14" width="178" height="9" rx="4.5" fill="#C9DAC3"/>
      <rect x="52" y="29" width="116" height="7" rx="3.5" fill="#E4ECE0"/>
      <rect x="392" y="14" width="74" height="16" rx="8" fill="#E9F3E5"/>
    </g>
  </g>

  <!-- Right chores window -->
  <g transform="translate(1074 184) rotate(4 245 145)" filter="url(#shadow)">
    <rect width="490" height="286" rx="24" fill="#FFFFFF"/>
    <rect width="490" height="52" rx="24" fill="#F7FAF4"/>
    <circle cx="32" cy="26" r="7" fill="#E7A8A1"/>
    <circle cx="54" cy="26" r="7" fill="#F1C86A"/>
    <circle cx="76" cy="26" r="7" fill="#83B06D"/>
    <text x="106" y="32" class="small">Chores Calendar</text>
    <g transform="translate(28 82)">
      <rect width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="74" width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="148" width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="222" width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="296" width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="370" width="60" height="172" rx="14" fill="#F8FAF6"/>
      <rect x="12" y="58" width="36" height="48" rx="12" fill="#DDEED7"/>
      <rect x="86" y="26" width="36" height="70" rx="12" fill="#F4E6D0"/>
      <rect x="160" y="86" width="36" height="56" rx="12" fill="#D8E8F2"/>
      <rect x="234" y="44" width="36" height="76" rx="12" fill="#DDEED7"/>
      <rect x="308" y="72" width="36" height="48" rx="12" fill="#F2DAD2"/>
      <rect x="382" y="34" width="36" height="86" rx="12" fill="#E5EAD8"/>
    </g>
  </g>
</svg>
