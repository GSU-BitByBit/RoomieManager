name: Backend CI/CD

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_AUDIENCE: ${{ secrets.SUPABASE_JWT_AUDIENCE }}
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Supabase database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing SUPABASE_DATABASE_URL secret."
            exit 1
          fi
          node -e "
          const value = process.env.DATABASE_URL;
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error('::error::SUPABASE_DATABASE_URL is not a valid URL.');
            process.exit(1);
          }

          if (!['postgresql:', 'postgres:'].includes(url.protocol)) {
            console.error('::error::SUPABASE_DATABASE_URL must use postgres/postgresql protocol.');
            process.exit(1);
          }

          if (url.username === 'postgres') {
            console.error('::error::SUPABASE_DATABASE_URL is using username \\\"postgres\\\".');
            console.error('::error::For Supabase pooler connections, use username format \\\"postgres.<project-ref>\\\".');
            process.exit(1);
          }

          if (!url.username.startsWith('postgres.')) {
            console.error('::error::Database username must match Supabase pooler format \\\"postgres.<project-ref>\\\".');
            process.exit(1);
          }

          if (/^db\\./.test(url.hostname) && url.hostname.endsWith('.supabase.co') && url.port === '5432') {
            console.error('::error::SUPABASE_DATABASE_URL is using direct host (db.<project-ref>.supabase.co:5432).');
            console.error('::error::Use Supabase session pooler host on :5432 (aws-1-<region>.pooler.supabase.com:5432).');
            process.exit(1);
          }

          if (!(url.hostname.endsWith('.pooler.supabase.com') && url.port === '5432')) {
            console.error('::error::SUPABASE_DATABASE_URL must use Supabase session pooler host on port 5432.');
            process.exit(1);
          }

          if (!url.searchParams.has('sslmode') || url.searchParams.get('sslmode') !== 'require') {
            console.warn('::warning::SUPABASE_DATABASE_URL should include sslmode=require.');
          }
          "

      - name: Run migrations
        run: pnpm prisma:migrate:deploy

      - name: Verify (lint + tests + build + OpenAPI contract)
        run: pnpm verify

  build_image:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.image_vars.outputs.image_repo }}
      image_tag_main: ${{ steps.image_vars.outputs.image_tag_main }}
      image_tag_sha: ${{ steps.image_vars.outputs.image_tag_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: image_vars
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner}/roomiemanager-backend"
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "image_tag_main=${image_repo}:main" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${image_repo}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_vars.outputs.image_repo }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_oci:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build_image
    runs-on: ubuntu-latest

    env:
      OCI_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
      OCI_USER: ${{ secrets.OCI_DEPLOY_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
      OCI_IMAGE_REF: ${{ needs.build_image.outputs.image_tag_sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_PUBLIC_HEALTHCHECK_URL: https://api.roomiemanager.site/api/v1/health/ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "$OCI_HOST"
          test -n "$OCI_USER"
          test -n "$OCI_SSH_KEY"
          test -n "$OCI_IMAGE_REF"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment assets to OCI
        run: |
          ssh -i ~/.ssh/oci_deploy_key "$OCI_USER@$OCI_HOST" "mkdir -p /srv/roomiemanager/backend/deploy"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/oci_deploy_key" \
            backend/deploy/ \
            "$OCI_USER@$OCI_HOST:/srv/roomiemanager/backend/deploy/"

      - name: Pin OCI runtime to GHCR image tag
        run: |
          ssh -i ~/.ssh/oci_deploy_key "$OCI_USER@$OCI_HOST" \
            "if sudo grep -q '^ROOMIEMANAGER_IMAGE=' /etc/roomiemanager/compose.env; then \
              sudo sed -i 's|^ROOMIEMANAGER_IMAGE=.*|ROOMIEMANAGER_IMAGE=$OCI_IMAGE_REF|' /etc/roomiemanager/compose.env; \
            else \
              printf '\nROOMIEMANAGER_IMAGE=%s\n' '$OCI_IMAGE_REF' | sudo tee -a /etc/roomiemanager/compose.env >/dev/null; \
            fi"

      - name: Authenticate OCI Docker runtime to GHCR
        run: |
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/oci_deploy_key "$OCI_USER@$OCI_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Roll out backend on OCI
        run: |
          ssh -i ~/.ssh/oci_deploy_key "$OCI_USER@$OCI_HOST" \
            "bash /srv/roomiemanager/backend/deploy/scripts/oci-deploy.sh"

      - name: Verify public production readiness
        run: curl --fail --silent --show-error "$BACKEND_PUBLIC_HEALTHCHECK_URL"
